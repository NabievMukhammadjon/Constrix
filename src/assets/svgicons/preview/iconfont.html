<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Іконковий шрифт</title>
	<style>
		html,body{
			height: 100%;
		}
		body{
			padding: 1.875rem;
			font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
			font-size: 1em;
			background-color:#333;
			color:#fff;
		}
		.iconfont-page h1{
			font-size: 1.875rem;
			margin-bottom: 2rem;
		}
		.iconfont-page ul{
			display: flex;
			flex-wrap: wrap;
			gap: 2.5rem;
			margin: 0;
			padding: 0;
		}
		.iconfont-page ul li{
			margin-bottom: 0.625rem;
			display: inline-flex;
			gap: 0.625rem;
			list-style: none;
			align-items: center;
		}
		.iconfont-page ul li::before{
			font-size: 2rem;
		}
		@font-face { 
	font-family: "iconfont"; 
	font-display: swap;
	src: url("D://nabiyev/Constrix/src/assets/svgicons/preview/iconfont.woff2?5694e0f71a3151340017c62bdcf68be2") format("woff2"); 
} 
[class*="--icon-"]::before{
	font-family: iconfont; 
}
	[class*="--icon-tool"]::before { 
		content: "\f101"; 
	} 
	[class*="--icon-start"]::before { 
		content: "\f102"; 
	} 
	[class*="--icon-quotes"]::before { 
		content: "\f103"; 
	} 
	[class*="--icon-phone"]::before { 
		content: "\f104"; 
	} 
	[class*="--icon-mail"]::before { 
		content: "\f105"; 
	} 
	[class*="--icon-logomark-black"]::before { 
		content: "\f106"; 
	} 
	[class*="--icon-logo"]::before { 
		content: "\f107"; 
	} 
	[class*="--icon-logo-white"]::before { 
		content: "\f108"; 
	} 
	[class*="--icon-logo-white-2"]::before { 
		content: "\f109"; 
	} 
	[class*="--icon-home"]::before { 
		content: "\f10a"; 
	} 
	[class*="--icon-consultation"]::before { 
		content: "\f10b"; 
	} 
	[class*="--icon-check"]::before { 
		content: "\f10c"; 
	} 
	[class*="--icon-arrow"]::before { 
		content: "\f10d"; 
	} 
	[class*="--icon-arrow-bottom"]::before { 
		content: "\f10e"; 
	} 

	</style>
</head>
<body>
	<div class="iconfont-page">
		<h1>Перелік іконок та їх класів:</h1>
		<ul>
				<li class="--icon-tool">--icon-tool</li>
				<li class="--icon-start">--icon-start</li>
				<li class="--icon-quotes">--icon-quotes</li>
				<li class="--icon-phone">--icon-phone</li>
				<li class="--icon-mail">--icon-mail</li>
				<li class="--icon-logomark-black">--icon-logomark-black</li>
				<li class="--icon-logo">--icon-logo</li>
				<li class="--icon-logo-white">--icon-logo-white</li>
				<li class="--icon-logo-white-2">--icon-logo-white-2</li>
				<li class="--icon-home">--icon-home</li>
				<li class="--icon-consultation">--icon-consultation</li>
				<li class="--icon-check">--icon-check</li>
				<li class="--icon-arrow">--icon-arrow</li>
				<li class="--icon-arrow-bottom">--icon-arrow-bottom</li>
		</ul>
	</div>
</body>
</html>
